  <path fill="#222222" d="M 1 12 A 2 2 0 1 1 5 12 A 2 2 0 1 1 1 12 Z M 11 4 A 2 2 0 1 1 15 4 A 2 2 0 1 1 11 4 Z M 5 11.2 H 8.8 V 12.8 H 5 Z M 7.2 4 H 8.8 V 12.8 H 7.2 Z M 7.2 3.2 H 11 V 4.8 H 7.2 Z"/>
</svg>
