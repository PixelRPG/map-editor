name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: gjsify check + build
    runs-on: ubuntu-latest

    # CI must not be the thing that decides which libadwaita this app may use —
    # the runtime it ships on decides that. `apps/maker-gjs/package.json` pins
    # the Flatpak runtime to GNOME 50, and the GNOME 50 SDK carries libadwaita
    # 1.9.3 / GTK 4.22.4 / GJS 1.88.1 / GtkSourceView 5.20.0 (measured with
    # `flatpak run --devel --command=pkg-config org.gnome.Sdk//50 --modversion …`).
    # `ubuntu-latest` (= ubuntu-24.04) carries libadwaita 1.5.0 / GTK 4.14.5 /
    # GJS 1.80.2 — four libadwaita minors behind the shipped runtime.
    #
    # That skew is a defect, not a constraint. It made CI reject code that runs
    # correctly in the shipped app: PR #288 failed with "Namespace Adw does not
    # contain a type called ToggleGroup" on a template that compiles on every
    # developer machine and inside the Flatpak. The tree's own floor had been
    # sitting at exactly 1.5 (Adw.AlertDialog / AboutDialog / Dialog), so Ubuntu
    # was one widget away from blocking the redesign for good — which needs
    # Adw.BottomSheet + Adw.MultiLayoutView (1.6), Adw.ToggleGroup (1.7) and
    # Adw.ShortcutsDialog (1.8).
    #
    # `fedora:44` is the fix because it is not merely NEWER, it is the SAME
    # toolkit: measured on the image, libadwaita 1.9.3, GTK 4.22.4, GJS 1.88.1,
    # GtkSourceView 5.20.0 — identical to the GNOME 50 SDK on all four, and it
    # packages blueprint-compiler 0.20.4, exactly the version this workflow used
    # to build from source. So CI now compiles against what users run.
    #
    # Keeping it that way is one rule: when `gjsify.flatpak.runtimeVersion`
    # moves, move this tag with it (GNOME 50 = Fedora 44, 49 = 43, 48 = 42).
    # `ghcr.io/gjsify/ci-fedora:44` would skip the dnf step below, but it is
    # another org's image on another org's release cadence, built for a much
    # larger package set; a bare Fedora tag keeps this repo's CI self-contained.
    container:
      image: fedora:44

    steps:
      - name: Install container prerequisites
        # Before `actions/checkout`, and it has to be: the Fedora base image has
        # no `git`, and checkout silently degrades to a REST tarball download
        # when it cannot find one. `tar`/`xz` are what `actions/setup-node`
        # unpacks its Node distribution with, `findutils` what several actions
        # shell out to. `libatomic` is insurance for a future Node bump — Node
        # >= 26's prebuilt binary links `libatomic.so.1`, which a minimal Fedora
        # container does not carry, and the failure mode is a bare loader error.
        #
        # Note for anyone extending this job: there is no `node` on PATH until
        # the `Setup Node.js` step below, so nothing above it may shell out to
        # `node` — and `${{ runner.temp }}` inside a container expands to the
        # HOST path, not a path that exists in here.
        run: dnf install -y --setopt=install_weak_deps=False git tar xz findutils libatomic

      - uses: actions/checkout@v6

      - name: Install GNOME dev libs
        # `blueprint-compiler` needs the `.gir` introspection files for the
        # namespaces referenced in `using …;` lines of our `.blp` templates
        # (Gtk 4.0, Adw 1, GtkSource 5) — and, unlike Ubuntu's 0.10, Fedora
        # packages 0.20.4, which understands the `css-classes: [...]` array
        # literal our templates use. That retires a from-source meson build.
        # `glib2` ships `glib-compile-resources` for `gjsify gresource` and
        # `glib-compile-schemas` for `gjsify gsettings`. The `gstreamer1-*-devel`
        # packages carry the Gst / GstSdp / GstWebRTC typelibs that satisfy
        # `@gjsify/webrtc`'s `gi://Gst` imports, which the engine test bundle
        # pulls in (collab/PeerSession) — without them the gjs test run aborts
        # at module load with "Typelib for Gst not found". The tests themselves
        # use fakes, so no gst runtime is needed. `pkgconf-pkg-config` provides
        # `pkg-config`, declared explicitly rather than inherited from a `-devel`
        # package: `gjsify system-check` treats it as a REQUIRED dependency and
        # reads library versions through it. `meson` is likewise required by
        # `system-check` and stays for that reason alone now that nothing builds
        # from source; `ninja-build` keeps its optional report at parity, so a
        # real regression there is not buried under new warnings.
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gjs \
            pkgconf-pkg-config \
            glib2 \
            glib2-devel \
            gobject-introspection-devel \
            gtk4-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            gstreamer1-devel \
            gstreamer1-plugins-base-devel \
            gstreamer1-plugins-bad-free-devel \
            libsoup3-devel \
            blueprint-compiler \
            meson \
            ninja-build \
            python3

      - name: Verify the toolkit floor matches the shipped runtime
        # The gate that makes the container choice above enforceable instead of
        # merely intended. It runs BEFORE the install/build so a base-image
        # regression fails in seconds naming the widget, rather than two minutes
        # later inside whichever unrelated `.blp` happens to touch it first —
        # which is precisely how #288 surfaced, as a mystery compile error in a
        # feature branch.
        #
        # Deliberately NOT a version comparison: mapping GNOME runtime version →
        # minimum libadwaita needs a table that nothing keeps honest. This asks
        # `blueprint-compiler` the same question the build asks — it resolves
        # every type against the installed `Adw-1` typelib — so the probe fails
        # exactly when and how a real template would.
        #
        # Every widget below is one this codebase uses or the concept docs
        # commit to. When the floor rises, add a row. Never delete a row to make
        # this pass: the runtime sets the floor, not the runner.
        run: |
          echo "Flatpak runtime declared by apps/maker-gjs: GNOME $(grep -o '"runtimeVersion": *"[0-9]*"' apps/maker-gjs/package.json | grep -o '[0-9]*')"
          echo "libadwaita     $(pkg-config --modversion libadwaita-1)"
          echo "GTK4           $(pkg-config --modversion gtk4)"
          echo "GJS            $(gjs --version | awk '{print $NF}')"
          echo "GtkSourceView  $(pkg-config --modversion gtksourceview-5)"
          echo "blueprint      $(blueprint-compiler --version)"

          probe="$(mktemp -d)"
          cat > "$probe/floor.blp" <<'BLP'
          using Gtk 4.0;
          using Adw 1;

          template $ToolkitFloorProbe: Adw.Bin {
            Adw.MultiLayoutView {            // libadwaita 1.6
              Adw.BottomSheet {              // libadwaita 1.6
                sheet: Adw.ToggleGroup {     // libadwaita 1.7
                  Adw.Toggle { label: "a"; } // libadwaita 1.7
                  Adw.Toggle { label: "b"; }
                };
              }
            }
          }

          Adw.ShortcutsDialog probe_shortcuts {   // libadwaita 1.8
            Adw.ShortcutsSection {
              title: "General";
              Adw.ShortcutsItem {
                title: "Quit";
                accelerator: "<Control>q";
              }
            }
          }
          BLP

          if ! blueprint-compiler compile "$probe/floor.blp" > "$probe/floor.ui"; then
            echo
            echo "The installed libadwaita is older than the GNOME runtime this app ships on."
            echo "The widget named above is the first one missing. Raise the container image"
            echo "to match gjsify.flatpak.runtimeVersion — do not drop the widget."
            exit 1
          fi

          for type in AdwMultiLayoutView AdwBottomSheet AdwToggleGroup AdwToggle AdwShortcutsDialog; do
            grep -q "\"$type\"" "$probe/floor.ui" || {
              echo "probe compiled but $type never reached the .ui — the probe is lying"
              exit 1
            }
          done
          echo "toolkit floor OK — every libadwaita 1.6 / 1.7 / 1.8 widget resolves"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install @gjsify/cli globally (pinned to the lockfile)
        # Bootstrap chicken-and-egg: the global CLI is needed for the
        # initial `gjsify install`, so it can't come from node_modules.
        # Pin it to the exact version gjsify-lock.json resolves for the
        # workspace (packages pin `@gjsify/cli: ^0.47.0`), so the
        # bootstrap CLI and the workspace-local CLI are always the same
        # build and CI never silently adopts a newer release — a broken
        # latest must not break CI without a repo change (global 0.4.40
        # e.g. could not even build the test bundles). Bumps happen by
        # updating the lockfile in dedicated commits.
        #
        # `packages['node_modules/@gjsify/cli'].version` is the shape
        # gjsify-lock.json uses at lockfile v4 (and used at v2 before the
        # 2026-09-05 regeneration); if a future lockfile version moves it,
        # this read prints `undefined` and `npm install -g
        # @gjsify/cli@undefined` fails loudly rather than installing
        # latest.
        run: |
          version=$(node -p "require('./gjsify-lock.json').packages['node_modules/@gjsify/cli'].version")
          npm install -g "@gjsify/cli@${version}"

      - name: Install dependencies (gjsify install --immutable)
        run: gjsify install --immutable

      - name: Verify system dependencies (gjsify system-check)
        # Preflight: GJS, GTK4, libadwaita, libsoup3 and gobject-introspection
        # are checked by their TYPELIB (what an app actually loads), not by a
        # `.pc` file — so this states the runtime the later steps assume rather
        # than the dev packages apt happened to install. Exits non-zero only on
        # a missing REQUIRED dependency; the optional block and the @girs↔library
        # skew report are informational. Runs after `gjsify install` because the
        # optional half is detected from the @gjsify/* packages in node_modules,
        # and before the type-check/build so a missing runtime fails in seconds
        # with an install hint instead of ten minutes later inside a bundle.
        run: gjsify system-check

      - name: Lint + format check (Biome)
        # `biome ci` = linter + formatter in check mode. Direct Biome —
        # the gjsify CLI's own lint/fix subcommands wrap oxlint/oxfmt,
        # which this repo doesn't use. GTK CSS is excluded in biome.json
        # (non-web dialect Biome cannot parse).
        run: ./node_modules/.bin/biome ci packages apps scripts

      - name: Verify dependency declarations are consistent (gjsify upgrade --check)
        # Offline drift gate — no registry calls. Fails when one dep is
        # declared at two different ranges across the workspace (the state
        # that makes `gjsify install` hoist one version while a package
        # believes it pinned another). A claim about the CHECKOUT, like the
        # Biome step above it, so it is deliberately not scoped to changed
        # packages. `gjsify upgrade --align` is the fix.
        run: gjsify upgrade --check

      - name: Type-check workspace
        run: gjsify foreach check -v -t

      - name: Build workspace
        run: gjsify foreach build -v -t

      - name: Verify barrel files are not stale
        run: gjsify foreach check:barrels -v -t

      - name: Verify every spec is registered in its package test.mts
        # `gjsify test` runs only the suites imported + passed to run() in
        # each package's hand-maintained src/test.mts. A *.spec.ts that
        # isn't registered there silently never runs (CI green, testing
        # nothing) — this trap has bitten the repo twice. Fails if any
        # spec file is missing from its package's test.mts.
        run: node scripts/check-spec-registration.mjs

      - name: Verify every declared gjsify asset path exists
        # package.json#gjsify blocks (flatpak/ship/storybook) name source
        # assets by path. Nothing checked that they resolve, so the maker
        # shipped — Flatpak included — with no application icon, found by
        # a human reading the file. Fails if a declared path is missing.
        run: node scripts/check-declared-assets.mjs

      - name: Verify no phantom dependencies
        # A package's src/** must declare every bare specifier it imports.
        # @pixelrpg/mcp-bridge resolved @gjsify/unit through root hoisting
        # alone — one hoisting change from a red build blamed on an
        # unrelated commit. Found five; four were unknown.
        run: node scripts/check-phantom-deps.mjs

      - name: Verify layer visibility has one owner
        # LayerData visibility (absent key == visible) must be decided
        # only by the engine's isLayerDataVisible. Three engine readers
        # had drifted apart, two of them into real bugs: a key-less layer
        # read as walkable to an agent and never had its tile properties
        # applied at runtime. Scopes by receiver — GTK's own widget
        # `visible` property shares the name.
        run: node scripts/check-layer-visibility.mjs

      - name: Verify every editor mode has a view
        # A mode-rail row is a promise: click here and you land
        # somewhere. `audio` had a row, a member in the EditorMode union
        # and no ViewStackPage — and three layers of code (an
        # `unimplemented` navigation variant, a "Coming soon" toast, a
        # spec pinning it) existed so the dead end would not show. The
        # four declarations of a mode live in two packages and two
        # languages; only a cross-file check holds them together.
        run: node scripts/check-mode-routes.mjs

      - name: Verify every .blp action has a handler
        # `action-name:` in a .blp is a name lookup at map time. A widget
        # bound to an unregistered action is rendered permanently
        # insensitive with no error, warning or log — the primary menu's
        # "Keyboard Shortcuts" item was greyed out in every build ever
        # made. The .blp files are in packages/gjs, the registry in
        # apps/maker-gjs, so neither type-check sees the other side.
        run: node scripts/check-blp-actions.mjs

      - name: Verify no GObject signal is declared but never emitted
        # Only the owning class can EMIT a signal, so "never emitted" is
        # fully decidable from this tree — unlike "never connected",
        # which a package's external consumers can legitimately do.
        # CastView's `character-changed` and TilesView's `tile-changed`
        # were both declared and emitted by nobody.
        run: node scripts/check-unemitted-signals.mjs

      - name: Verify every engine component is read by a system
        # A component built on every spawn and read by no system is a
        # feature that round-trips through save/load and does nothing.
        # CollisionComponent ships a "Blocks movement" label, is seeded
        # by three templates, is asserted by a spec — and no system
        # consults it, so the player walks through every chest. Known
        # gaps need a marker in the file AND an entry in the script.
        run: node scripts/check-orphan-components.mjs

      - name: Run engine tests (collab op-log + awareness contract)
        # The platform-independent @pixelrpg/engine suite — the collab
        # round-trip (op-log sync, awareness, snapshot exchange) + the
        # registry-completeness guard that fails if a new Command isn't
        # registered. Runs under both gjs + node. Keeps "new feature must
        # stay collab-compatible" enforced, not just documented.
        run: gjsify foreach test -v -p --include @pixelrpg/engine

      - name: Run gjs widget tests (GTK-free helper logic)
        # The @pixelrpg/gjs suite. The widgets themselves subclass
        # Gtk.Widget and can't run headlessly, so this covers the pure,
        # GTK-free helpers extracted alongside them (e.g. MapPreview's
        # fingerprint + viewport-clamp geometry). Runs under both gjs + node.
        run: gjsify foreach test -v -p --include @pixelrpg/gjs

      - name: Run maker tests (collab transport + session services)
        # The @pixelrpg/maker-gjs suite (18 suites): SessionService
        # host/join e2e over REAL LAN signalling (WebSocket on loopback,
        # exercises @gjsify/ws over Soup), collab-session (+e2e),
        # lan-discovery/-signalling, relay signalling, pause policy,
        # engine-state sync, sandbox paths… Headless-safe: no display or
        # WebGL needed; LAN specs bind 127.0.0.1 only, and the real-Avahi
        # discovery integration spec skips itself when no avahi-daemon is
        # available (this runner). Runs under both gjs + node.
        run: gjsify foreach test -v -p --include @pixelrpg/maker-gjs

      - name: Run signalling-server tests (room manager + relay e2e)
        # The @pixelrpg/signalling-server suite: RoomManager unit tests
        # plus the end-to-end relay test, which spawns the GJS bundle
        # built in the build step above (via the pinned global `gjsify`
        # on PATH) and drives it with real `ws` clients from Node.
        run: gjsify foreach test -v -p --include @pixelrpg/signalling-server

      - name: Run mcp-bridge tests (instance → D-Bus address routing)
        # The @pixelrpg/mcp-bridge suite. The bridge proper opens a live
        # session bus at module load (GJS-only), so this covers its
        # dependency-free helpers — the instance-label → bus-name/path
        # routing whose `sanitizeLabel` must stay byte-identical to the
        # maker's `sanitizeInstanceId` (else the bridge dials a name nobody
        # owns). Runs under both gjs + node.
        run: gjsify foreach test -v -p --include @pixelrpg/mcp-bridge
